name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govcheck_test
          POSTGRES_USER: govcheck
          POSTGRES_PASSWORD: govcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govcheck -d govcheck_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://govcheck:govcheck@localhost:5432/govcheck_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        run: python -m pip install -e 'apps/api[dev]'
      - name: Lint API
        run: python -m ruff check apps/api/src apps/api/tests
      - name: Apply PostgreSQL migrations
        run: cd apps/api && alembic upgrade head
      - name: Test API
        run: cd apps/api && python -m pytest
      - name: Check generated web contracts
        run: make check-contracts API_PYTHON=python

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Test web components
        run: pnpm --dir apps/web test
      - name: Type-check web
        run: pnpm --dir apps/web exec tsc --noEmit --incremental false
      - name: Build web
        run: pnpm --dir apps/web build
      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Test reviewer flow
        run: pnpm --dir apps/web test:e2e

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/evaluation/pyproject.toml
      - name: Install evaluation harness
        run: python -m pip install -e 'packages/evaluation[dev]'
      - name: Test evaluation metrics and dataset
        run: make eval-test EVAL_PYTHON=python
      - name: Reproduce deterministic baseline
        run: make eval-fake EVAL_PYTHON=python
      - name: Check versioned evaluation outputs
        run: git diff --exit-code -- docs/evaluation.md packages/evaluation/results/fake-baseline.json
