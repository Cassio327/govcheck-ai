services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: govcheck
      POSTGRES_USER: govcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govcheck}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govcheck -d govcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./apps/api
      args:
        INSTALL_EMBEDDINGS: ${INSTALL_EMBEDDINGS:-false}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://govcheck:${POSTGRES_PASSWORD:-govcheck}@postgres:5432/govcheck
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      args:
        INSTALL_EMBEDDINGS: ${INSTALL_EMBEDDINGS:-false}
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://govcheck:${POSTGRES_PASSWORD:-govcheck}@postgres:5432/govcheck
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIMENSION: 384
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
