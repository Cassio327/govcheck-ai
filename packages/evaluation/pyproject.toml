[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "govcheck-eval"
version = "0.1.0"
description = "Versioned evaluation harness for GovCheck AI"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
govcheck-eval = "govcheck_eval.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["govcheck_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
